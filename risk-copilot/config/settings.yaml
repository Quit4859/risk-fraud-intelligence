mcp:  # All connectors fail soft in synthetic mode; no external call is attempted
  # unless `enabled` is true and credentials are present.
  jira:
    enabled: false
    base_url: ""
    project_key: RISK
  slack:
    enabled: false
    webhook_url: ""
    channel: "#risk-alerts"
  filesystem_evidence:
    enabled: true

snowflake:
  # DDL in sql/ is dialect-portable; the local runtime executes the same
  # logic through sqlite so the full flow runs without a warehouse.
  account: ""
  warehouse: RISK_WH
  database: RISK_INTELLIGENCE
  schema: CORE
  role: RISK_COPILOT_ROLE
