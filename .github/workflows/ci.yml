name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # The suite runs entirely on the local engine. No Snowflake credentials are
      # present or needed: the fallback path is the one under test, and a test
      # that only passes with a warehouse would be testing the wrong thing.
      RISK_PROFILE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "import wsgi, api.index, backend.orchestration.copilot"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  secret-scan:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git"; exit 1
          fi
          test -f .env.example || {
            echo "::error::.env.example missing"; exit 1; }
      - name: Scan for credential-shaped strings
        run: |
          # Exclude *.example (templates), docs/* (prose) and .github/* (this
          # workflow literally contains the scan pattern, so it must not scan
          # itself). A bareword match on `snowflake_password` also hit the
          # env-var *name* in source, so that term now matches only a hardcoded
          # value assignment: `SNOWFLAKE_PASSWORD = "..."` is a leak, while
          # `os.environ["SNOWFLAKE_PASSWORD"]` is not.
          if git grep -nIE '(BEGIN (RSA |EC )?PRIVATE KEY|snowflake_password[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_@.-]{6,}|[A-Za-z0-9_-]{24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{24})' \
               -- . ':!*.example' ':!docs/*' ':!.github'; then
            echo "::error::credential-shaped string committed"; exit 1
          fi
